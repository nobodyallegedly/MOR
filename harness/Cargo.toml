[package]
name = "mor-harness"
version = "0.1.0"
description = "The freeze-suite harness: runs scenarios of the freeze test suite against real relays and homes, starting with the identity gauntlet (scenario 5, steps 6 to 7d)."
edition.workspace = true
license.workspace = true

[[bin]]
name = "mor-gauntlet"
path = "src/main.rs"

[dependencies]
mor-core = { path = "../core" }
mor-relay = { path = "../relay" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
clap = { version = "4", features = ["derive"] }
# The second, independent SLH-DSA implementation: the harness checks every
# safety-key signature it meets against it, as every test of the core does.
slh-dsa = "=0.2.0-rc.5"

[dev-dependencies]
mor-payment = { path = "../cmips/payment" }
mor-lightning = { path = "../modules/lightning", features = ["lnd"] }
mor-onchain = { path = "../modules/onchain", features = ["btcd"] }
mor-anchoring = { path = "../cmips/anchoring" }
# Real BOLT 11 invoices, signed by a test node key, in the anchoring test.
lightning-invoice = "0.33"
# The payer's wallet in the on-chain test: rust-bitcoin signs its
# transactions, and the payee's sweep of a payment with the tweaked key.
bitcoin = "0.32"
