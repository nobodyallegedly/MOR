[package]
name = "mor-wasm"
version = "0.1.0"
description = "The MOR core library for TypeScript clients, through WebAssembly: making and checking acts, identity chains, X-Wing and sealed containers."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mor-core = { path = "../core" }
# Pinned exactly: the JavaScript glue is generated by wasm-bindgen-cli of the
# same version (see clients/README.md).
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
hex = "0.4"
# The bindings draw fresh randomness for keys, salts, nonces and content keys
# (the core library never draws it); in a browser or Node, from
# crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }
