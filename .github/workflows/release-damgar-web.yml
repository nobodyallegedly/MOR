# Damgar's web client's release (testing only; to be served at
# damgar.dubsar.org), built on GitHub's Linux machines as Dub's is
# (release-dub-web.yml), so that anyone on Linux x86-64 can rebuild the same
# bytes. Runs on a push to main whose message contains "[release damgar
# web]", or by hand. It rebuilds clients/damgar/built/ with the pinned tools
# and, if anything changed, commits it to main.
name: release damgar web client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release damgar web]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the WebAssembly and the web client's release
        run: |
          cd clients/genesis && npm ci --no-audit --no-fund && npm run wasm
          for p in dub desk manage; do (cd ../$p && npm ci --no-audit --no-fund); done
          cd ../damgar && npm ci --no-audit --no-fund && npm run release
      - name: The release, built again, is the same
        run: cd clients/damgar && npm run test:build
      - name: Commit the release if it changed
        env:
          TZ: UTC
        run: |
          if git diff --quiet -- clients/damgar/built; then echo "::notice::the release is unchanged"; exit 0; fi
          for f in clients/damgar/built/*; do echo "::notice::$(sha256sum "$f")"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/damgar/built
          git commit -m "Damgar web client released from ${GITHUB_SHA::7}, built on GitHub (Linux x86-64)" -m "Rebuild: cd clients/genesis && npm run wasm; cd ../damgar && npm run release."
          git push origin HEAD:main
