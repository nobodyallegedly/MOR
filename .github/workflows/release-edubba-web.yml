# Edubba's web client's release (testing only; to be served at
# edubba.dubsar.org; the code in clients/desk), built on GitHub's Linux
# machines as Dub's is
# (release-dub-web.yml), so that anyone on Linux x86-64 can rebuild the same
# bytes. Runs on a push to main whose message contains "[release edubba
# web]", or by hand: it rebuilds clients/desk/built/ with the pinned tools
# and, if anything changed, commits it to main. On a pull request touching
# Edubba, it rebuilds the release the same way and only says whether
# GitHub's machine gives the bytes the pull request carries in built/.
name: release edubba web client

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - clients/desk/**
      - .github/workflows/release-edubba-web.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[release edubba web]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the WebAssembly and the web client's release
        run: |
          cd clients/genesis && npm ci --no-audit --no-fund && npm run wasm
          (cd ../dub && npm ci --no-audit --no-fund)
          cd ../desk && npm ci --no-audit --no-fund && npm run release
      - name: The release, built again, is the same
        run: cd clients/desk && npm run test:build
      - name: On a pull request, the release it carries is the one GitHub builds
        if: github.event_name == 'pull_request'
        run: |
          for f in clients/desk/built/*; do echo "::notice::$(sha256sum "$f")"; done
          git diff --stat --exit-code -- clients/desk/built
      - name: Commit the release if it changed
        if: github.event_name != 'pull_request'
        env:
          TZ: UTC
        run: |
          if git diff --quiet -- clients/desk/built; then echo "::notice::the release is unchanged"; exit 0; fi
          for f in clients/desk/built/*; do echo "::notice::$(sha256sum "$f")"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/desk/built
          git commit -m "Edubba web client released from ${GITHUB_SHA::7}, built on GitHub (Linux x86-64)" -m "Rebuild: cd clients/genesis && npm run wasm; cd ../desk && npm run release."
          git push origin HEAD:main
