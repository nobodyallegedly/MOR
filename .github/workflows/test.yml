# Every test, on GitHub's machines, at each change to main and each pull
# request: the same steps as scripts/test-all.sh, one named step each, so a
# failure shows which part failed. Later steps run even when one fails.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MOR_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust workspace
        run: cargo test --workspace --locked
      - name: Conformance vectors, regenerated byte for byte
        if: success() || failure()
        run: cargo run -q -p mor-core --example gen_vectors --locked && git diff --exit-code core/vectors
      - name: Conformance vectors, the independent Python check
        if: success() || failure()
        run: pip install --quiet cryptography 'unicodedata2==17.0.0' && python3 core/vectors/check.py
      - name: Core library for the clients (WebAssembly)
        if: success() || failure()
        run: cd clients/genesis && npm ci --no-audit --no-fund && npm run wasm
      - name: clients/assess
        # The assessment tool (round 9, F411: in CI). Its tests run a home and a relay, and a fake Anthropic API on this machine: no key, nothing sent out.
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/assess && npm ci --no-audit --no-fund && npm run typecheck && npm test
      - name: clients/barebone
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/barebone && npm ci --no-audit --no-fund && npm test
      - name: clients/collective
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: cd clients/collective && npm ci --no-audit --no-fund && npm test
      - name: clients/connector
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/connector && npm ci --no-audit --no-fund && npm test
      - name: clients/desk
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 40
        if: success() || failure()
        # Edubba's tests run Dub, Damgar, Kišib, Ummia (with the site's listing and the reports mirror), the test wallet and the split and anchoring services beside it (round 3).
        run: for p in dub barebone repo collective assess kishib manage anchoring-service testwallet damgar site longform connector reader reports ummia split-service; do (cd clients/$p && npm ci --no-audit --no-fund) || exit 1; done; cd clients/desk && npm ci --no-audit --no-fund && npm test
      - name: clients/genesis
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/genesis && npm ci --no-audit --no-fund && npm test
      - name: clients/grants
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/grants && npm ci --no-audit --no-fund && npm test
      - name: clients/longform
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/longform && npm ci --no-audit --no-fund && npm test
      - name: clients/manage
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/manage && npm ci --no-audit --no-fund && npm test
      - name: clients/kit
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/kit && npm ci --no-audit --no-fund && npm test
      - name: clients/dub
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: cd clients/desk && npm ci --no-audit --no-fund && cd ../dub && npm ci --no-audit --no-fund && npm test
      - name: clients/kishib
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: for p in desk dub barebone repo collective assess; do (cd clients/$p && npm ci --no-audit --no-fund) || exit 1; done; cd clients/kishib && npm ci --no-audit --no-fund && npm test
      - name: clients/damgar
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: for p in desk dub barebone repo collective assess kishib manage anchoring-service testwallet; do (cd clients/$p && npm ci --no-audit --no-fund) || exit 1; done; cd clients/damgar && npm ci --no-audit --no-fund && npm test
      - name: clients/ummia
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: for p in desk dub barebone repo collective assess kishib manage anchoring-service damgar site longform connector reader reports; do (cd clients/$p && npm ci --no-audit --no-fund) || exit 1; done; cd clients/ummia && npm ci --no-audit --no-fund && npm test
      - name: clients/anchoring-service
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/anchoring-service && npm ci --no-audit --no-fund && npm test
      - name: clients/testwallet
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/testwallet && npm ci --no-audit --no-fund && npm test
      - name: clients/reader
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/reader && npm ci --no-audit --no-fund && npm test
      - name: clients/repo
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd clients/repo && npm ci --no-audit --no-fund && npm test
      - name: clients/reports
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: for p in barebone connector desk reader site; do (cd clients/$p && npm ci --no-audit --no-fund) || exit 1; done; cd clients/reports && npm ci --no-audit --no-fund && npm test
      - name: clients/site
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        shell: bash
        run: |
          set +e +o pipefail
          cd clients/site
          npm ci --no-audit --no-fund || exit 1
          npm test 2>&1 | tee ../../test-output.txt; status=${PIPESTATUS[0]}
          grep -E 'not ok|Command failed|error\[|error:|stderr|differ|!=|wasm' ../../test-output.txt | grep -v '^ *at \|checkExecSync\|genericNode' | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
      - name: modules/jpeg
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd modules/jpeg && npm ci --no-audit --no-fund && npm test
      - name: modules/video
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd modules/video && npm ci --no-audit --no-fund && npm test
      - name: modules/audio
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd modules/audio && npm ci --no-audit --no-fund && npm test
      - name: modules/carry
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd modules/carry && npm ci --no-audit --no-fund && npm test
      - name: modules/timestamp
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 20
        if: success() || failure()
        run: cd modules/timestamp && npm ci --no-audit --no-fund && npm test
      - name: Reproducible build of the display client
        if: success() || failure()
        # On a pull request the released client is expected to differ until the release that follows the merge:
        # a notice there, a failure on main.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set +e +o pipefail
          cd clients/site
          npm run test:build 2>&1 | tee ../../test-output.txt; status=${PIPESTATUS[0]}
          grep -E 'not ok|Command failed|error\[|error:|stderr|differ|!=|wasm' ../../test-output.txt | grep -v '^ *at \|checkExecSync\|genericNode' | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
      - name: Fingerprints of this machine's build (to compare with built/)
        if: success() || failure()
        # On a pull request the released client is expected to differ until the release that follows the merge:
        # a notice there, a failure on main.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          cd clients/site && node --import tsx scripts/build.ts --out "$RUNNER_TEMP/linux-build" >/dev/null
          cd ../..
          for f in clients/genesis/wasm/mor_wasm_bg.wasm clients/genesis/wasm/mor_wasm.js "$RUNNER_TEMP/linux-build/gateway.js" "$RUNNER_TEMP/linux-build/mor_wasm_bg.wasm" clients/site/built/gateway.js clients/site/built/mor_wasm_bg.wasm; do
            echo "::notice::$(sha256sum "$f" | sed "s#$RUNNER_TEMP/##") $(stat -c %s "$f") bytes"
          done
          diff clients/site/built/gateway.js "$RUNNER_TEMP/linux-build/gateway.js" | head -4 | cut -c1-300 | while IFS= read -r l; do echo "::warning::gateway.js diff: $l"; done
          diff <(strings -n 8 clients/site/built/mor_wasm_bg.wasm) <(strings -n 8 "$RUNNER_TEMP/linux-build/mor_wasm_bg.wasm") | head -12 | cut -c1-300 | while IFS= read -r l; do echo "::warning::wasm strings diff: $l"; done

  # The money apps end to end on a private regtest network (no real money):
  # btcd and three lnd nodes from their release archives, each checked
  # against the SHA-256 in its project's signed manifest, started by
  # modules/lightning/regtest/up.sh. Damgar's tip, on-chain payment and
  # anchor, the test wallet, the Lightning rail Module's own test, and
  # round 3's end to end (a collective's money through its split service).
  regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOR_CHROMIUM: /usr/bin/google-chrome
      BTCD: btcd-linux-amd64-v0.24.2
      BTCD_SHA256: f7ee4005a0f597d0486eb5cb17218eb51fcb9bed93bbb4d416a57f3975df69e5
      LND: lnd-linux-amd64-v0.18.5-beta
      LND_SHA256: ffffa63b28a031a330eae4db234ada1bd27003059757c1a0d3aeb0d8d7351c4f
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: btcd and lnd, checked
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/btcsuite/btcd/releases/download/v0.24.2/$BTCD.tar.gz"
          curl -sSfLO "https://github.com/lightningnetwork/lnd/releases/download/v0.18.5-beta/$LND.tar.gz"
          printf '%s  %s\n' "$BTCD_SHA256" "$BTCD.tar.gz" "$LND_SHA256" "$LND.tar.gz" | sha256sum -c -
          tar xzf "$BTCD.tar.gz" && tar xzf "$LND.tar.gz"
      - name: The regtest network
        run: BTCD_DIR="$RUNNER_TEMP/$BTCD" LND_DIR="$RUNNER_TEMP/$LND" modules/lightning/regtest/up.sh "$RUNNER_TEMP/regtest"
      - name: Lightning rail Module (Rust)
        if: success() || failure()
        run: MOR_LN_REGTEST="$RUNNER_TEMP/regtest" cargo test -p mor-harness --test lightning_rail --locked -- --nocapture
      - name: Core library for the clients (WebAssembly)
        if: success() || failure()
        run: cd clients/genesis && npm ci --no-audit --no-fund && npm run wasm
      - name: clients/testwallet on regtest
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: cd clients/testwallet && npm ci --no-audit --no-fund && MOR_LN_REGTEST="$RUNNER_TEMP/regtest" node --import tsx --test test/regtest.test.ts
      - name: clients/damgar on regtest
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: for p in desk dub barebone repo collective assess kishib manage anchoring-service; do (cd clients/$p && npm ci --no-audit --no-fund) || exit 1; done; cd clients/damgar && npm ci --no-audit --no-fund && MOR_LN_REGTEST="$RUNNER_TEMP/regtest" node --import tsx --test test/regtest.test.ts
      - name: clients/desk on regtest (round 3, end to end)
        # Each app its own limit: one that hangs fails alone, the steps after it still run (suite round 8, F407).
        timeout-minutes: 30
        if: success() || failure()
        run: for p in dub barebone repo collective assess kishib manage anchoring-service testwallet damgar site longform connector reader reports ummia split-service; do (cd clients/$p && npm ci --no-audit --no-fund) || exit 1; done; cd clients/desk && npm ci --no-audit --no-fund && MOR_LN_REGTEST="$RUNNER_TEMP/regtest" node --import tsx --test test/round-3.test.ts
      - name: Stop the network
        if: always()
        run: BTCD_DIR="$RUNNER_TEMP/$BTCD" LND_DIR="$RUNNER_TEMP/$LND" modules/lightning/regtest/down.sh "$RUNNER_TEMP/regtest" || true
