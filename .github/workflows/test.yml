# Every test, on GitHub's machines, at each change to main and each pull
# request: the same steps as scripts/test-all.sh, one named step each, so a
# failure shows which part failed. Later steps run even when one fails.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOR_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust workspace
        run: cargo test --workspace --locked
      - name: Core library for the clients (WebAssembly)
        if: success() || failure()
        run: cd clients/genesis && npm ci --no-audit --no-fund && npm run wasm
      - name: clients/barebone
        if: success() || failure()
        run: cd clients/barebone && npm ci --no-audit --no-fund && npm test
      - name: clients/collective
        if: success() || failure()
        run: cd clients/collective && npm ci --no-audit --no-fund && npm test
      - name: clients/connector
        if: success() || failure()
        run: cd clients/connector && npm ci --no-audit --no-fund && npm test
      - name: clients/desk
        if: success() || failure()
        run: cd clients/desk && npm ci --no-audit --no-fund && npm test
      - name: clients/genesis
        if: success() || failure()
        run: cd clients/genesis && npm ci --no-audit --no-fund && npm test
      - name: clients/longform
        if: success() || failure()
        run: cd clients/longform && npm ci --no-audit --no-fund && npm test
      - name: clients/manage
        if: success() || failure()
        run: cd clients/manage && npm ci --no-audit --no-fund && npm test
      - name: clients/reader
        if: success() || failure()
        run: cd clients/reader && npm ci --no-audit --no-fund && npm test
      - name: clients/repo
        if: success() || failure()
        run: cd clients/repo && npm ci --no-audit --no-fund && npm test
      - name: clients/site
        if: success() || failure()
        shell: bash
        run: |
          set +e +o pipefail
          cd clients/site
          npm ci --no-audit --no-fund || exit 1
          npm test 2>&1 | tee ../../test-output.txt; status=${PIPESTATUS[0]}
          grep -E 'not ok|Command failed|error\[|error:|stderr|differ|!=|wasm' ../../test-output.txt | grep -v '^ *at \|checkExecSync\|genericNode' | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
      - name: modules/jpeg
        if: success() || failure()
        run: cd modules/jpeg && npm ci --no-audit --no-fund && npm test
      - name: Reproducible build of the display client
        if: success() || failure()
        shell: bash
        run: |
          set +e +o pipefail
          cd clients/site
          npm run test:build 2>&1 | tee ../../test-output.txt; status=${PIPESTATUS[0]}
          grep -E 'not ok|Command failed|error\[|error:|stderr|differ|!=|wasm' ../../test-output.txt | grep -v '^ *at \|checkExecSync\|genericNode' | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
      - name: Fingerprints of this machine's build (to compare with built/)
        if: success() || failure()
        shell: bash
        run: |
          cd clients/site && node --import tsx scripts/build.ts --out "$RUNNER_TEMP/linux-build" >/dev/null
          cd ../..
          for f in clients/genesis/wasm/mor_wasm_bg.wasm clients/genesis/wasm/mor_wasm.js "$RUNNER_TEMP/linux-build/gateway.js" "$RUNNER_TEMP/linux-build/mor_wasm_bg.wasm" clients/site/built/gateway.js clients/site/built/mor_wasm_bg.wasm; do
            echo "::notice::$(sha256sum "$f" | sed "s#$RUNNER_TEMP/##") $(stat -c %s "$f") bytes"
          done
          diff clients/site/built/gateway.js "$RUNNER_TEMP/linux-build/gateway.js" | head -8 | cut -c1-300 | while IFS= read -r l; do echo "::warning::gateway.js diff: $l"; done
          diff <(strings -n 8 clients/site/built/mor_wasm_bg.wasm) <(strings -n 8 "$RUNNER_TEMP/linux-build/mor_wasm_bg.wasm") | head -12 | cut -c1-300 | while IFS= read -r l; do echo "::warning::wasm strings diff: $l"; done
