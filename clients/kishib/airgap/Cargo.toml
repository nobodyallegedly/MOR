# Kišib's half of the conversation with Nakišib: the air-gapped chain-key
# signer Module's online side (`modules/airgap`, `online`), built to a small
# WebAssembly of Kišib's own (`scripts/build-airgap-wasm.sh`). A workspace of
# its own: nothing compiled into the suite's shared WebAssembly (wasm/)
# changes because of it.
[package]
name = "kishib-airgap"
version = "0.1.0"
description = "Kišib's half of the air-gapped chain-key signer Module: the pending rotation written for Nakišib, the signed rotation checked before publishing (rule 3.9), a commitment export read."
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mor-airgap = { path = "../../../modules/airgap", default-features = false }
mor-core = { path = "../../../core" }
# Pinned exactly, as the shared WebAssembly's: the glue is generated by wasm-bindgen-cli of the same version.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
