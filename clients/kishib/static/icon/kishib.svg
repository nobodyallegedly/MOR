<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kišib (Sumerian KIŠIB, "the cylinder seal"): a stone cylinder seal standing beside the strip of clay it was rolled across, its carving, the name, left there, in the family's clay and stone. Tinted with the Identity layer's glacier blue (#8ec5f0; H36, "colors are too subtle, thicker line, and subtle tints on the fills"): a thick edge, #658cac (70% of the layer colour over the dark); the dark #0e131a, the stone #758a9e and #8ca1b5, the clay #8a7563 (each its own colour moved 6%, 25%, 25% and 12% toward the layer colour); a line on the seal's top in the layer colour itself. Its name carved in cuneiform (H36): 𒈩, the sign MES, read kišib (U+12229; confirmed by the author against Wiktionary after the session found 𒆨 KISIM₅ not to read kišib), traced by hand from the author's picture of it; once on the seal, mirrored, at the top, as a seal is cut, and once on the clay, at the bottom, as it leaves it (the author: "Bottom on the right, and top on the left"). No glow. -->
  <defs>
  <!-- 𒈩 (MES, kišib): eleven wedges, in a 1024 by 731 box, the sign within x 68 to 920 and y 57 to 645. -->
  <g id="kisib">
    <path d="M68 258 Q103 268 138 258 L116 607 L97 607 Z"/>
    <path d="M130 202 Q144 270 130 338 Q260 282 392 282 L392 258 Q260 252 130 202 Z"/>
    <path d="M130 377 Q144 445 130 512 Q260 458 395 455 L395 433 Q260 430 130 377 Z"/>
    <path d="M367 203 Q405 211 442 203 Q418 390 415 578 L397 578 Q395 390 367 203 Z"/>
    <path d="M405 57 Q420 124 405 190 Q600 150 795 143 L788 117 Q600 112 405 57 Z"/>
    <path d="M785 115 Q852 126 920 115 Q868 350 862 595 L843 595 Q838 350 785 115 Z"/>
    <path d="M405 512 Q420 578 405 645 Q630 600 862 598 L862 575 Q630 572 405 512 Z"/>
    <path d="M448 185 Q484 193 520 185 Q498 360 494 528 L478 528 Q472 360 448 185 Z"/>
    <path d="M520 185 Q556 193 592 185 Q570 360 566 540 L550 540 Q544 360 520 185 Z"/>
    <path d="M592 185 Q628 193 664 185 Q642 360 638 552 L622 552 Q616 360 592 185 Z"/>
    <path d="M662 185 Q698 193 734 185 Q712 360 708 562 L692 562 Q686 360 662 185 Z"/>
    <path d="M732 185 Q768 193 804 185 Q782 360 778 572 L762 572 Q756 360 732 185 Z"/>
  </g>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#0e131a"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#658cac" stroke-width="16"/>
  <!-- The seal: a stone cylinder, its top seen as an ellipse with the bore for its cord. -->
  <path d="M248 300 V720 A86 26 0 0 0 420 720 V300 Z" fill="#758a9e"/>
  <ellipse cx="334" cy="300" rx="86" ry="26" fill="#8ca1b5"/>
  <ellipse cx="334" cy="300" rx="16" ry="6" fill="#3a4654"/>
  <ellipse cx="334" cy="300" rx="83" ry="23" fill="none" stroke="#8ec5f0" stroke-width="6"/>
  <!-- Its carving: the name, mirrored, at the top. -->
  <g fill="#475564">
    <use href="#kisib" transform="translate(406 372) scale(-0.17 0.17) translate(-68 -57)"/>
  </g>
  <!-- The strip of clay it leaves: the same marks, twice over, as the seal rolls. -->
  <rect x="490" y="246" width="282" height="532" rx="40" fill="#8a7563"/>
  <rect x="490" y="246" width="282" height="532" rx="40" fill="none" stroke="#a48e7a" stroke-width="6" opacity=".55"/>
  <!-- The name it leaves on the clay, at the bottom. -->
  <g fill="#5e4c3e">
    <use href="#kisib" transform="translate(516 550) scale(0.27 0.27) translate(-68 -57)"/>
  </g>
</svg>
