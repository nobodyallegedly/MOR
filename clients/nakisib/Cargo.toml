# Nakišib, Kišib's offline companion: the air-gapped chain-key signer Module
# (modules/airgap, draft 6) given a face on a Mac that never connects. A
# workspace of its own, so that nothing compiled into the shared
# WebAssembly (wasm/, the root workspace) changes because of it.
[package]
name = "nakisib"
version = "0.1.0"
description = "Nakišib (stone seal): the offline Mac's program for the air-gapped chain-key signer Module. Reads Kišib's pending rotation, builds its own summary, takes the paper, draws a fresh one, signs on SIGN; makes a new identity's first paper and its commitment. Keeps nothing secret. No network: its page is served on 127.0.0.1 only."
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
# The Module's own code: every rule Nakišib applies is there (device, summary, msg, transport).
mor-airgap = { path = "../../modules/airgap" }
mor-core = { path = "../../core" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
# The page's requests, read as JSON (the loopback page only).
serde_json = "1"

[dev-dependencies]
hex = "0.4"

# SLH-DSA is slow unoptimised, as in the root workspace.
[profile.dev.package.fips205]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
# The program carried to the offline Mac: one file, no debug symbols to read paths from.
strip = true
