  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#0f0f10"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#8d877c" stroke-width="16"/>
  <!-- The seal: a stone cylinder, standing, its top an ellipse with the bore for its cord. -->
  <path d="M372 262 V770 A140 36 0 0 0 652 770 V262 Z" fill="#77746e"/>
  <path d="M372 262 V770 A140 36 0 0 0 420 795 V292 Z" fill="#6b6863"/>
