  <g fill="#4a4844">
    <use href="#na4" transform="translate(632 340) scale(-0.235 0.235) translate(-68 -57)"/>
    <use href="#kisib" transform="translate(632 545) scale(-0.235 0.235) translate(-68 -57)"/>
