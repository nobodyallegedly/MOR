<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Nakišib (na₄ kišib, "stone seal"; na₄ is a silent determinative in the texts, so the reading is built, not attested: chosen by Nobody, allegedly, knowing it): a stone cylinder seal alone, standing, no clay, in the family's stone and quiet, the Nakišib tint stone (#b9b2a5): a thick edge #8d877c, the dark #0f0f10, the stone #77746e and #8f8b83 (stone moved toward the tint), a line on the seal's top in the tint itself. Its name carved once, down the seal in one column, mirrored, as a seal is cut: 𒎎 (NA4, U+1238E) above 𒈩 (MES, read kišib, U+12229, traced by hand for Kišib's icon from the author's picture). NA4 here is the session's own drawing of the sign's wedges (NI and UD side by side, as it is written), not traced from a source: to confirm against the ePSD or Borger. No glow. -->
  <defs>
  <!-- 𒈩 (MES, kišib): as in Kišib's icon (clients/kishib/static/icon/kishib.svg). -->
  <g id="kisib">
    <path d="M68 258 Q103 268 138 258 L116 607 L97 607 Z"/>
    <path d="M130 202 Q144 270 130 338 Q260 282 392 282 L392 258 Q260 252 130 202 Z"/>
