<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Damgar (dam-gàr, the merchant; F338): a clay tablet with a resting duck carved right out of it, one solid recessed carving of a duck at rest, its long neck turned back and its head laid along its back, as on the Mesopotamian duck weights by which merchants weighed silver; the fold of the neck one hollow left in the clay; no eye, no separate colours. Tinted with the Money layer's gold (#e8b33a; H36, by Kišib's rule): a thick edge, #a4802c (70% of the layer colour over the dark); the dark #14120f, the clay #957359, its lit rim #ac8a64 and the carving #6f5335 (each its own colour moved 6% or 12% toward the layer colour); a line of silver beneath the tablet. No glow. -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#14120f"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#a4802c" stroke-width="16"/>
  <!-- The tablet: a pillow of clay, a little uneven, as tablets are. -->
  <path d="M236 330 Q232 286 280 282 L742 276 Q792 274 792 324 L796 676 Q798 726 748 728 L282 732 Q232 734 232 684 Z" fill="#957359"/>
  <path d="M236 330 Q232 286 280 282 L742 276 Q792 274 792 324 L796 676 Q798 726 748 728 L282 732 Q232 734 232 684 Z" fill="none" stroke="#ac8a64" stroke-width="7" opacity=".6"/>
  <!-- The duck, carved out: one recessed shape in one colour, at rest: the body an egg with a short raised tail; the long neck rising from the breast and folding back; the head laid on the back, its flat bill toward the tail; clay left inside the fold. -->
  <g fill="#6f5335">
    <path d="M244 526 C268 534 286 542 304 548 C334 514 410 502 500 502 C620 502 754 514 760 592 C764 660 640 684 500 684 C372 684 284 660 264 602 C258 580 252 552 244 526 Z"/>
    <path d="M708 604 C770 546 788 420 730 376 C676 340 612 370 598 428" fill="none" stroke="#6f5335" stroke-width="62" stroke-linecap="round"/>
    <path d="M626 446 C626 480 594 500 556 500 C512 500 488 486 486 466 C484 440 516 418 560 418 C598 418 626 424 626 446 Z"/>
    <path d="M500 448 C468 452 432 470 400 496 C406 506 418 510 432 506 C462 494 492 488 520 486 Z"/>
  </g>
  <!-- A line of silver beneath. -->
  <path d="M300 792 H724" stroke="#aab0b8" stroke-width="10" stroke-linecap="round"/>
</svg>
