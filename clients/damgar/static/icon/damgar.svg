<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Damgar (dam-gàr, the merchant; F338): a clay tablet with a resting duck carved right out of it, one solid recessed carving in the shape of a rubber duck, as an ancient hand would cut it (the Mesopotamian duck weight, by which merchants weighed silver); no eye, no separate colours. Tinted with the Money layer's gold (#e8b33a; H36, by Kišib's rule): a thick edge, #a4802c (70% of the layer colour over the dark); the dark #14120f, the clay #957359, its lit rim #ac8a64 and the carving #6f5335 (each its own colour moved 6% or 12% toward the layer colour); a line of silver beneath the tablet. No glow. -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#14120f"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#a4802c" stroke-width="16"/>
  <!-- The tablet: a pillow of clay, a little uneven, as tablets are. -->
  <path d="M236 330 Q232 286 280 282 L742 276 Q792 274 792 324 L796 676 Q798 726 748 728 L282 732 Q232 734 232 684 Z" fill="#957359"/>
  <path d="M236 330 Q232 286 280 282 L742 276 Q792 274 792 324 L796 676 Q798 726 748 728 L282 732 Q232 734 232 684 Z" fill="none" stroke="#ac8a64" stroke-width="7" opacity=".6"/>
  <!-- The duck, carved out: one recessed shape, resting, its head up, its bill forward. -->
  <path fill="#6f5335" d="M284 404 C292 524 330 652 474 664 C610 678 708 640 708 560 C708 522 690 500 668 490 C692 484 722 478 750 468 L764 452 C750 440 720 436 700 434 C702 378 664 346 616 348 C566 350 540 390 548 432 C552 460 516 470 466 468 C390 466 324 446 284 404 Z"/>
  <!-- A line of silver beneath. -->
  <path d="M300 792 H724" stroke="#aab0b8" stroke-width="10" stroke-linecap="round"/>
</svg>
