<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ummia (ummia, the master of the tablet house; F339): a round school tablet, as the scribes' schools used them, its name carved once, between a ruled line above and a ruled line below (Nobody, allegedly, 17 October 2026: “do not repeat the word twice, only once, with line above and below”). One solid carving in one colour, recessed into the clay; no glow. The name, carved in cuneiform: 𒌝𒈪𒀀 (UM.MI.A, U+1231D, U+1222A, U+12000; decided by Nobody, allegedly, 17 October 2026: UM.MI.A, the spelling um-mi-a), the sign forms Noto Sans Cuneiform's (SIL Open Font License 1.1), whose outlines are traced here as paths. Tinted with coral, #ee8b74 (Kišib's rule, H36): a thick edge, #a86455 (70% of the layer colour over the dark); the dark #141012, the clay #966e59, its lit rim #ad856a and the carving #6f4e3c (each the family's own colour moved 6% or 12% toward the layer colour). -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#141012"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#a86455" stroke-width="16"/>
