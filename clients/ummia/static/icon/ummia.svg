<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ummia (ummia, the master of the tablet house; F339): a round school tablet, as the scribes' schools used them, the master's model line above and the pupil's copy beneath, a ruled line between: the specification, and an implementation checked against it. One solid carving in one colour, recessed into the clay; no glow. The line is the name, carved in cuneiform: 𒌝𒈪𒀀 (UM.MI.A, U+1231D, U+1222A, U+12000; decided by Nobody, allegedly, 17 October 2026: UM.MI.A, the spelling um-mi-a), the sign forms Noto Sans Cuneiform's (SIL Open Font License 1.1), whose outlines are traced here as paths, the pupil's copy a little uneven. Tinted with coral, #ee8b74 (Kišib's rule, H36): a thick edge, #a86455 (70% of the layer colour over the dark); the dark #141012, the clay #966e59, its lit rim #ad856a and the carving #6f4e3c (each the family's own colour moved 6% or 12% toward the layer colour). -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#141012"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#a86455" stroke-width="16"/>
  <!-- The tablet: a round of clay, a lentil, a little uneven. -->
  <path d="M512 186 C700 184 840 328 838 514 C836 702 696 840 508 838 C322 836 184 698 186 510 C188 326 326 188 512 186 Z" fill="#966e59"/>
  <path d="M512 186 C700 184 840 328 838 514 C836 702 696 840 508 838 C322 836 184 698 186 510 C188 326 326 188 512 186 Z" fill="none" stroke="#ad856a" stroke-width="8" opacity=".7"/>
