<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Edubba ("the tablet house"; H25, H36): a clay tablet with a house carved out of it, its roof and walls themselves tablets: two leaning together as the roof, three standing as the walls, each with its lines of writing left in bare clay. One solid carving in one colour, recessed into the clay; no glow, no name (none verified for it). Tinted with the Agreements layer's emerald, #48c08c (Kišib's rule, H36): a thick edge, #348966 (70% of the layer colour over the dark); the dark #0a1314, the clay #827457, its lit rim #998b6e and the carving #5b553f (each the family's own colour moved 6% or 12% toward the layer colour). -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#0a1314"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#348966" stroke-width="16"/>
  <!-- The tablet: a pillow of clay, a little uneven, standing. -->
  <path d="M262 262 Q258 214 306 212 L716 208 Q766 206 766 256 L770 768 Q772 818 722 818 L308 822 Q258 824 258 774 Z" fill="#827457"/>
  <path d="M262 262 Q258 214 306 212 L716 208 Q766 206 766 256 L770 768 Q772 818 722 818 L308 822 Q258 824 258 774 Z" fill="none" stroke="#998b6e" stroke-width="7" opacity=".6"/>
  <!-- The carving: the roof's two tablets, leaning together; the three wall tablets. -->
  <g fill="#5b553f">
    <rect x="-36" y="-132" width="72" height="264" rx="16" transform="translate(432 368) rotate(52)"/>
    <rect x="-36" y="-132" width="72" height="264" rx="16" transform="translate(592 368) rotate(-52)"/>
    <rect x="322" y="476" width="104" height="276" rx="20"/>
    <rect x="460" y="476" width="104" height="276" rx="20"/>
    <rect x="598" y="476" width="104" height="276" rx="20"/>
  </g>
  <!-- The walls' writing, left in bare clay. -->
  <g stroke="#827457" stroke-width="10" stroke-linecap="round">
    <path d="M348 534 H400 M348 592 H400 M348 650 H384"/>
    <path d="M486 534 H538 M486 592 H538 M486 650 H522"/>
    <path d="M624 534 H676 M624 592 H676 M624 650 H660"/>
  </g>
</svg>
