  <!-- Dub (𒁾, "tablet"; H25, H36): a clay tablet with its name carved once, one solid carving in one colour, recessed into the clay; no glow. The name, carved in cuneiform: 𒁾 (DUB, U+1207E; MZL 242, Deimel 138; ePSD2 sign DUB, values dub, kišib₃, ṭup), in its Neo-Assyrian form ("The neo Assyrian is cleaner"), the sign form Noto Sans Cuneiform's (SIL Open Font License 1.1), whose outline is traced here as a path. Tinted with the Text layer's warm pearl, #e9dfcd (Kišib's rule, H36): a thick edge, #a59f93 (70% of the layer colour over the dark); the dark #141518, the clay #95785f, its lit rim #ac8f76 and the carving #6f5846 (each the family's own colour moved 6% or 12% toward the layer colour). -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#141518"/>
  <rect x="108" y="108" width="808" height="808" rx="176" fill="none" stroke="#a59f93" stroke-width="16"/>
  <!-- The tablet: a pillow of clay, a little uneven, as tablets are. -->
  <path d="M236 330 Q232 286 280 282 L742 276 Q792 274 792 324 L796 676 Q798 726 748 728 L282 732 Q232 734 232 684 Z" fill="#95785f"/>
  <path d="M236 330 Q232 286 280 282 L742 276 Q792 274 792 324 L796 676 Q798 726 748 728 L282 732 Q232 734 232 684 Z" fill="none" stroke="#ac8f76" stroke-width="7" opacity=".6"/>
