[package]
name = "mor-core"
version = "0.1.0"
description = "The MOR core library: deterministic CBOR, tagged hashes, acts, locking, canonical text, running summaries, signatures and the identity-chain checks."
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = { version = "0.10", default-features = false }
# No default features: the library never draws randomness itself (callers
# supply keys, nonces and salts), and this keeps it building to WebAssembly.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Pinned exactly: its tables must be Unicode 17.0, the version the Text MIP pins.
# A newer release could carry newer tables; a test checks the version.
unicode-normalization = "=0.1.25"
# SLH-DSA, for safety keys (FIPS 205, SHA2-128s and SHA2-128f). Adopted by Nobody, allegedly
# on condition that the tests check every signature against a second,
# independent implementation (the `slh-dsa` dev-dependency). Pinned exactly.
fips205 = { version = "=0.4.1", default-features = false, features = ["slh_dsa_sha2_128s", "slh_dsa_sha2_128f"] }
# Only to hand fips205 the caller's bytes where it asks for randomness.
rand_core = { version = "0.6.4", default-features = false }
# Schnorr over secp256k1 (BIP-340), for signing keys.
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"] }
# X-Wing (F98), for encryption keys and sealed containers: ML-KEM-768 through
# fips203, X25519 through x25519-dalek (curve25519-dalek 4.1.3 or later, which
# fixes RUSTSEC-2024-0344), combined with SHA3-256 and expanded with SHAKE256.
# Adopted on condition that the tests check every key exchange against a
# second, independent implementation (libcrux, a dev-dependency). Pinned exactly.
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-768"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
curve25519-dalek = { version = ">=4.1.3, <5", default-features = false }
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
# The second, independent SLH-DSA implementation (RustCrypto) the tests check
# every fips205 signature against.
slh-dsa = "=0.2.0-rc.5"
# The second, independent X-Wing: libcrux's formally verified ML-KEM-768 and
# X25519, with the draft's combiner written again in the tests.
libcrux-ml-kem = "0.0.10"
libcrux-curve25519 = "0.0.8"
libcrux-sha3 = "0.0.10"
