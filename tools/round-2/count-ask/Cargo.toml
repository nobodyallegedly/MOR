# count-ask: asks verifier 2 (mor-core's agreements_new::grammar) directly,
# from act files given at run time. Its own crate, outside the repository's
# workspace; it depends on mor-core by path and changes nothing in it.
[package]
name = "count-ask"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# The checkout `v2` (commit f1a13feb) beside this folder's `tools/`.
mor-core = { path = "../../../core" }
hex = "0.4"
serde_json = "1"

# The same settings the repository gives its slow signature crates.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.mor-core]
opt-level = 2
